<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Новогодний Адвент-календарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg-dark: #0a0c1a;
    --bg-light: #1a1c3b;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 215, 0, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.2);
    --text-main: #fdfbf7;
    --text-dim: #a0a5b8;
    --gold: #e8c37b; 
    --gold-glow: rgba(232, 195, 123, 0.4);
    --success: #34d399;
    --error: #f87171;
}

html, body { height: 100%; }

body {
    font-family: 'Montserrat', sans-serif;
    color: var(--text-main);
    background-color: var(--bg-dark);
    min-height: 100vh;
    padding: 30px 15px 60px;
    position: relative;
    overflow-x: hidden;
}

/* ФОН */
.bg-layer { position: fixed; inset: 0; z-index: -4; background: linear-gradient(to bottom, var(--bg-dark) 0%, var(--bg-light) 100%); }
.street-lights { position: fixed; inset: 0; z-index: -3; overflow: hidden; pointer-events: none; }
.light-orb { position: absolute; border-radius: 50%; background: var(--gold); filter: blur(15px); opacity: 0.4; animation: pulseLight 4s infinite alternate; }
.light-orb:nth-child(1) { top: 15%; left: 10%; width: 60px; height: 60px; }
.light-orb:nth-child(2) { top: 25%; left: 85%; width: 80px; height: 80px; animation-delay: 1s; background: #a855f7; opacity: 0.3;}
.light-orb:nth-child(3) { top: 70%; left: 20%; width: 50px; height: 50px; animation-delay: 2s; background: #38bdf8; opacity: 0.3;}
.light-orb:nth-child(4) { top: 80%; left: 75%; width: 90px; height: 90px; animation-delay: 0.5s; }
.light-orb:nth-child(5) { top: 50%; left: 50%; width: 40px; height: 40px; animation-delay: 1.5s; background: #fff; opacity: 0.2;}
@keyframes pulseLight { 0% { transform: scale(0.9); opacity: 0.2; } 100% { transform: scale(1.1); opacity: 0.5; } }

#snowCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

/* ИНТРО (ЛОГОТИП) */
#screen-intro { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 5000; background: var(--bg-dark); transition: opacity 1s ease, visibility 1s ease; }
#screen-intro.hidden { opacity: 0; visibility: hidden; }

/* Убираем CSS-анимации, которые глючат в браузере. Всё делает JS */
.intro-logo-container { position: relative; display: flex; justify-content: center; align-items: center; opacity: 0; transform: scale(0.9) translateY(20px); transition: all 1s ease-out; }
.intro-logo-container.visible { opacity: 1; transform: scale(1) translateY(0); }
.intro-logo-img { width: 220px; height: auto; filter: drop-shadow(0 0 25px var(--gold-glow)); transition: transform 0.5s ease; }

/* СТЕКЛО */
.wrapper { max-width: 980px; margin: 0 auto; position: relative; }
.glass-panel { position: relative; max-width: 720px; margin: 0 auto; padding: 40px; background: var(--glass-bg); backdrop-filter: blur(25px) saturate(140%); -webkit-backdrop-filter: blur(25px) saturate(140%); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 var(--glass-highlight); }
.glass-panel::before { content: ''; position: absolute; inset: 0; border-radius: 24px; background: linear-gradient(140deg, rgba(255,215,0,0.05) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.02) 100%); pointer-events: none; }
@media (max-width: 600px) { .glass-panel { padding: 30px 20px; border-radius: 20px; } .intro-logo-img { width: 160px; } }

/* ЭКРАНЫ */
.screen { display: none; }
.screen.active { display: block; }
.anim-screen { opacity: 0; transform: translateY(15px); transition: opacity 0.5s ease, transform 0.5s ease; }
.anim-screen.visible { opacity: 1; transform: translateY(0); }

/* ФОРМА */
.header { text-align: center; margin-bottom: 34px; padding: 10px; }
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(to right, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .subtitle { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }

.form-group { margin-bottom: 20px; position: relative; opacity: 0; transform: translateX(-15px); transition: opacity 0.4s ease, transform 0.4s ease; }
.form-group:nth-child(1) { transition-delay: 0.1s; }
.form-group:nth-child(2) { transition-delay: 0.2s; }
.form-row { display: flex; gap: 15px; opacity: 0; transform: translateX(-15px); transition: opacity 0.4s ease, transform 0.4s ease; transition-delay: 0.3s; }
.form-row .form-group { flex: 1; opacity: 1; transform: none; transition: none; }

.form-group.visible, .form-row.visible { opacity: 1; transform: translateX(0); }

.form-group label { display: block; font-size: 11px; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
.form-group input { width: 100%; padding: 15px 18px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 12px; color: var(--text-main); font-size: 15px; font-family: inherit; outline: none; transition: all 0.3s ease; }
.form-group input::placeholder { color: rgba(255, 255, 255, 0.15); }
.form-group input:focus { border-color: var(--gold); background: rgba(232, 195, 123, 0.05); box-shadow: 0 0 15px rgba(232, 195, 123, 0.15); }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 15px 24px; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #1a1c3b; background: linear-gradient(135deg, #fdfbf7, var(--gold)); border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 15px rgba(232, 195, 123, 0.3); margin-top: 10px; font-family: inherit; width: 100%; opacity: 0; transform: translateX(-15px); transition: opacity 0.4s ease, transform 0.4s ease; transition-delay: 0.4s; }
.btn.visible { opacity: 1; transform: translateX(0); }
.btn:hover:not(:disabled) { transform: translateY(-2px); background: linear-gradient(135deg, #fff, #f0d190); box-shadow: 0 8px 25px rgba(232, 195, 123, 0.6); }
.btn.ghost { background: rgba(255, 255, 255, 0.03); color: var(--gold); border: 1px solid rgba(232, 195, 123, 0.3); box-shadow: none; }

/* КАЛЕНДАРЬ */
.calendar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
@media (max-width: 780px) { .calendar-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
@media (max-width: 480px) { .calendar-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } }

.day-card { aspect-ratio: 1; position: relative; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); opacity: 0; transform: scale(0.8) translateY(15px); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.day-card.visible { opacity: 1; transform: scale(1) translateY(0); }

.day-card::before { content: ''; position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(140deg, rgba(255, 255, 255, 0.1) 0%, transparent 40%); pointer-events: none; }
.day-number { font-size: 22px; font-weight: 700; line-height: 1; color: #fff; transition: all 0.3s ease; }
.day-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin-top: 2px; font-weight: 500; }

.day-card.available { background: rgba(232, 195, 123, 0.1); border-color: rgba(232, 195, 123, 0.4); box-shadow: 0 0 20px rgba(232, 195, 123, 0.1); }
.day-card:hover, .day-card:active { transform: translateY(-4px) scale(1.02) !important; box-shadow: 0 8px 25px rgba(232, 195, 123, 0.4); border-color: var(--gold); }
.day-card:hover .day-number, .day-card.available .day-number { color: var(--gold); }

.day-card.completed { background: rgba(52, 211, 153, 0.08); border-color: rgba(52, 211, 153, 0.3); }
.day-card.completed .day-number { color: var(--success); }
.day-card.completed::after { content: '✓'; position: absolute; top: 6px; right: 8px; color: var(--success); font-size: 12px; font-weight: 700; }
.day-card.locked { cursor: not-allowed; opacity: 0.3; filter: grayscale(1); }

/* ТЕСТ */
.test-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
.back-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 215, 0, 0.15); color: var(--text-dim); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.back-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--gold); }
.day-badge { padding: 6px 14px; background: rgba(232, 195, 123, 0.1); border: 1px solid rgba(232, 195, 123, 0.3); border-radius: 100px; font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }

.progress { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.progress-bar { height: 100%; width: 0%; border-radius: 2px; background: var(--gold); box-shadow: 0 0 10px var(--gold-glow); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

.question-counter { text-align: center; font-size: 11px; color: var(--text-dim); margin-bottom: 24px; font-weight: 500; }

.question { font-size: 17px; line-height: 1.5; font-weight: 600; margin-bottom: 24px; color: #fff; opacity: 0; transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease; }
.question.visible { opacity: 1; transform: translateY(0); }

.options { display: flex; flex-direction: column; gap: 10px; }
.option { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-size: 14px; font-weight: 500; opacity: 0; transform: translateX(-15px); transition: opacity 0.4s ease, transform 0.4s ease; }
.option.visible { opacity: 1; transform: translateX(0); }
.option:nth-child(1) { transition-delay: 0.1s; }
.option:nth-child(2) { transition-delay: 0.15s; }
.option:nth-child(3) { transition-delay: 0.2s; }
.option:nth-child(4) { transition-delay: 0.25s; }

.option:hover { background: rgba(232, 195, 123, 0.08); border-color: rgba(232, 195, 123, 0.3); }
.option .marker { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; transition: all 0.2s ease; }
.option.selected { background: rgba(232, 195, 123, 0.15); border-color: var(--gold); }
.option.selected .marker { border-color: var(--gold); }
.option.selected .marker::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

/* ШТОРКИ */
.curtain { position: fixed; top: 0; bottom: 0; width: 50.5%; background: #070811; z-index: 4000; transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1); pointer-events: none; }
.curtain.left { left: 0; transform: translateX(-100%); border-right: 1px solid rgba(232, 195, 123, 0.2); }
.curtain.right { right: 0; transform: translateX(100%); }
.curtain.open.left { transform: translateX(0); }
.curtain.open.right { transform: translateX(0); }

/* ТЕКСТ ШТОРОК */
.curtain-text { position: fixed; inset: 0; z-index: 5000; display: flex; justify-content: center; align-items: center; pointer-events: none; }
.curtain-text h2 { font-family: 'Playfair Display', serif; font-style: italic; font-size: 32px; color: var(--gold); text-align: center; text-shadow: 0 0 20px var(--gold-glow); padding: 0 20px; opacity: 0; transform: scale(0.8) translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
.curtain-text.show h2 { opacity: 1; transform: scale(1) translateY(0); }
@media (max-width: 600px) { .curtain-text h2 { font-size: 24px; } }

/* БЛОКИРОВКА И УВЕДОМЛЕНИЯ */
.blocked-screen { text-align: center; }
.blocked-screen .icon { font-size: 56px; margin-bottom: 14px; }
.blocked-screen h2 { color: var(--error); font-size: 22px; margin-bottom: 12px; font-weight: 700; }
.blocked-screen p { color: var(--text-dim); margin-bottom: 8px; font-size: 14px; }
.blocked-screen .warning { margin-top: 20px; padding: 14px; background: rgba(248, 113, 113, 0.05); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 10px; color: #fca5a5; font-size: 12px; text-align: left; }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 140%); padding: 12px 24px; background: rgba(10, 12, 26, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(232, 195, 123, 0.3); border-radius: 10px; color: var(--text-main); font-size: 13px; font-weight: 500; z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); max-width: calc(100vw - 40px); text-align: center; }
.toast.show { transform: translate(-50%, 0); }

.overlay { position: fixed; inset: 0; background: rgba(10, 12, 26, 0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; padding: 30px; z-index: 2000; text-align: center; }
.overlay.show { display: flex; }
.overlay-content { max-width: 420px; padding: 34px; background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); border-radius: 20px; opacity: 0; transform: scale(0.9); transition: opacity 0.3s ease, transform 0.3s ease; }
.overlay.show .overlay-content { opacity: 1; transform: scale(1); }
.overlay-content h2 { font-size: 20px; color: #fca5a5; margin-bottom: 12px; }
.overlay-content p { color: var(--text-main); font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>

<div class="curtain left" id="curtainLeft"></div>
<div class="curtain right" id="curtainRight"></div>
<div class="curtain-text" id="curtainText"><h2>До завтрашнего дня...</h2></div>

<div id="screen-intro">
    <div class="intro-logo-container" id="logoContainer">
        <img class="intro-logo-img" src="Без%20названия46_20261110012711.png" alt="Логотип" onerror="this.style.display='none'">
    </div>
</div>

<div class="bg-layer"></div>
<div class="street-lights">
    <div class="light-orb"></div><div class="light-orb"></div><div class="light-orb"></div><div class="light-orb"></div><div class="light-orb"></div>
</div>
<canvas id="snowCanvas"></canvas>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
    <div class="overlay-content">
        <h2>⚠️ Обнаружен уход со страницы</h2>
        <p>Вы переключили вкладку или свернули окно.<br>Это зафиксировано как нарушение.</p>
    </div>
</div>

<div class="wrapper">
    <div id="screen-register" class="screen active">
        <div class="glass-panel">
            <div class="header"><h1>Добро пожаловать</h1><div class="subtitle">Давайте познакомимся</div></div>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group"><label>Имя</label><input type="text" id="regName" placeholder="Например: Иван" required autocomplete="off"></div>
                <div class="form-group"><label>Фамилия</label><input type="text" id="regSurname" placeholder="Например: Иванов" required autocomplete="off"></div>
                <div class="form-row">
                    <div class="form-group"><label>Класс</label><input type="number" id="regClass" placeholder="10" min="1" max="11" required></div>
                    <div class="form-group"><label>Литер</label><input type="text" id="regLetter" placeholder="А" maxlength="2" required style="text-transform: uppercase;"></div>
                </div>
                <button type="submit" class="btn full">Войти</button>
            </form>
        </div>
    </div>

    <div id="screen-calendar" class="screen">
        <div class="header">
            <h1>Адвент-календарь</h1>
            <div class="subtitle" id="userGreeting">Привет!</div>
            <div class="today-info" id="todayInfo" style="margin-top: 15px; display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;"></div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div id="screen-test" class="screen">
        <div class="glass-panel">
            <div class="test-header">
                <button class="back-btn" onclick="backToCalendar()">← Назад</button>
                <div class="day-badge" id="testDayBadge">День 1</div>
                <div style="width: 74px;"></div>
            </div>
            <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            <div class="question-counter" id="questionCounter"></div>
            <div class="question" id="questionText"></div>
            <div class="options" id="options"></div>
        </div>
    </div>

    <div id="screen-blocked" class="screen">
        <div class="glass-panel blocked-screen">
            <div class="icon">🚫</div>
            <h2>Тест заблокирован</h2>
            <p>Вы покинули страницу во время прохождения теста.</p>
            <div class="warning" id="blockedReason"></div>
            <button class="btn ghost full" onclick="backToCalendar()" style="margin-top: 20px;">← К календарю</button>
        </div>
    </div>
</div>

<script>
const TEST_MODE = true; 
const YEAR = new Date().getFullYear();
const TOTAL_DAYS = 24;
const STORAGE_KEY_PROGRESS = 'advent_progress_' + YEAR;
const STORAGE_KEY_USER = 'advent_user';

const questionPool = [
    { question: "Что такое HTML?", options: ["Язык программирования","Язык разметки гипертекста","База данных","Операционная система"], correct: 1 },
    { question: "Какая функция выводит в консоль?", options: ["print()","echo()","console.log()","alert()"], correct: 2 },
    { question: "Что означает CSS?", options: ["Cascading Style Sheets","Computer Style System","Creative Style Script","Central Style Sheet"], correct: 0 },
    { question: "Какого типа данных НЕТ в JavaScript?", options: ["string","boolean","integer","number"], correct: 2 },
    { question: "Тег для создания ссылки?", options: ["<link>","<a>","<href>","<url>"], correct: 1 }
];

let state = { progress: {} };
let currentUser = null;
let currentDay = null;
let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let testActive = false;
let violations = 0;
let startTime = null;
let isTransitioning = false;

function getQuestionsForDay(day) {
    const count = 5;
    const start = (day - 1) % questionPool.length;
    const q = [];
    for (let i = 0; i < count; i++) q.push(questionPool[(start + i) % questionPool.length]);
    return q;
}

function loadData() {
    try {
        const rawProg = localStorage.getItem(STORAGE_KEY_PROGRESS);
        if (rawProg) state.progress = JSON.parse(rawProg);
        const rawUser = localStorage.getItem(STORAGE_KEY_USER);
        if (rawUser) currentUser = JSON.parse(rawUser);
    } catch (e) {}
}

function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(state.progress)); } catch (e) {}
}

function handleRegister(event) {
    event.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const surname = document.getElementById('regSurname').value.trim();
    const cls = document.getElementById('regClass').value.trim();
    const letter = document.getElementById('regLetter').value.trim().toUpperCase();
    if (!name || !surname || !cls || !letter) return showToast('Заполните все поля');
    currentUser = { name, surname, class: cls, letter };
    try { localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(currentUser)); } catch (e) {}
    startCalendar();
}

function getTodayDayNumber() {
    if (TEST_MODE) return 1; 
    const now = new Date();
    if (now.getMonth() !== 11 || now.getFullYear() !== YEAR) return null;
    const day = now.getDate();
    return (day >= 1 && day <= 24) ? day : null;
}

function getDayStatus(day) {
    if (state.progress[day]?.completed) return 'completed';
    if (TEST_MODE) return 'available'; 
    const today = getTodayDayNumber();
    if (today === null) return 'locked';
    if (day === today) return 'available';
    if (day < today) return 'missed';
    return 'locked';
}

function startCalendar() {
    document.getElementById('userGreeting').textContent = `Привет, ${currentUser.name} из ${currentUser.class}${currentUser.letter}!`;
    renderCalendar();
    showScreen('calendar');
}

// Вспомогательная функция для появления элементов
function makeVisible(el, delay) {
    setTimeout(() => el.classList.add('visible'), delay);
}

function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    const todayInfo = document.getElementById('todayInfo');
    
    if (TEST_MODE) {
        todayInfo.textContent = `Режим тестирования: доступны все дни`;
        todayInfo.style.color = '#1a1c3b';
        todayInfo.style.background = 'var(--gold)';
        todayInfo.style.border = '1px solid var(--gold)';
    } else {
        todayInfo.style.color = 'var(--gold)';
        todayInfo.style.background = 'rgba(232, 195, 123, 0.1)';
        todayInfo.style.border = '1px solid rgba(232, 195, 123, 0.3)';
        const today = getTodayDayNumber();
        if (today !== null) todayInfo.textContent = `Сегодня ${today} декабря · доступно задание дня ${today}`;
        else todayInfo.textContent = 'Календарь откроется 1 декабря';
    }

    for (let day = 1; day <= TOTAL_DAYS; day++) {
        const status = getDayStatus(day);
        const card = document.createElement('div');
        card.className = `day-card ${status}`;
        
        let labelText = 'Закрыто';
        if (status === 'completed') labelText = 'Пройдено';
        else if (status === 'available') labelText = 'Открыть';
        else if (status === 'missed') labelText = 'Пропущено';
        
        card.innerHTML = `<div class="day-number">${day}</div><div class="day-label">${labelText}</div>`;
        card.addEventListener('click', () => onDayClick(day, status));
        grid.appendChild(card);
        
        // Плавное появление карточек с задержкой
        makeVisible(card, day * 40);
    }
}

function onDayClick(day, status) {
    if (status === 'available') openTest(day);
    else if (status === 'locked') showToast(`Этот день ещё закрыт`);
    else if (status === 'missed') showToast('Этот день уже прошёл.');
    else if (status === 'completed') showToast('Вы уже прошли это задание ✓');
}

function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
        s.classList.remove('visible'); // Сбрасываем класс видимости
    });
    const screen = document.getElementById('screen-' + name);
    screen.classList.add('active');
    
    // Запуск анимации появления экрана
    setTimeout(() => {
        screen.classList.add('visible');
        
        // Если это регистрация, анимируем поля
        if (name === 'register') {
            document.querySelectorAll('#screen-register .form-group, #screen-register .form-row, #screen-register .btn').forEach(el => {
                el.classList.add('visible');
            });
        }
    }, 50);
}

function backToCalendar() {
    if (testActive && !confirm('Выйти из теста? Прогресс текущего дня будет потерян.')) return;
    testActive = false;
    showScreen('calendar');
    renderCalendar();
}

function openTest(day) {
    currentDay = day;
    questions = getQuestionsForDay(day);
    currentQuestion = 0;
    score = 0;
    selectedAnswer = null;
    isTransitioning = false;
    testActive = true;
    violations = 0;
    startTime = Date.now();
    document.getElementById('testDayBadge').textContent = `День ${day}`;
    showScreen('test');
    setTimeout(loadQuestion, 400);
}

function loadQuestion() {
    selectedAnswer = null;
    isTransitioning = false;
    const q = questions[currentQuestion];
    
    const qEl = document.getElementById('questionText');
    qEl.textContent = q.question;
    qEl.classList.remove('visible');
    
    document.getElementById('questionCounter').textContent = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
    document.getElementById('progressBar').style.width = `${(currentQuestion / questions.length) * 100}%`;
    
    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    
    // Появление вопроса
    setTimeout(() => qEl.classList.add('visible'), 50);

    q.options.forEach((option, index) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `<div class="marker"></div><span>${option}</span>`;
        div.onclick = () => selectOption(index, div);
        optionsEl.appendChild(div);
        
        // Появление вариантов ответа каскадом
        makeVisible(div, 100 + (index * 50));
    });
}

function selectOption(index, div) {
    if (isTransitioning) return;
    isTransitioning = true;
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    div.classList.add('selected');
    selectedAnswer = index;
    const q = questions[currentQuestion];
    if (selectedAnswer === q.correct) score++;
    
    setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            finishDayAndShowCurtains();
        }
    }, 600);
}

function finishDayAndShowCurtains() {
    testActive = false;
    state.progress[currentDay] = { completed: true, score: score, total: questions.length, date: new Date().toISOString() };
    saveProgress();
    
    renderCalendar(); 

    const curtainLeft = document.getElementById('curtainLeft');
    const curtainRight = document.getElementById('curtainRight');
    const curtainText = document.getElementById('curtainText');

    curtainLeft.classList.add('open');
    curtainRight.classList.add('open');

    setTimeout(() => { curtainText.classList.add('show'); }, 1000);
    setTimeout(() => { curtainText.classList.remove('show'); }, 3200);
    setTimeout(() => {
        curtainLeft.classList.remove('open');
        curtainRight.classList.remove('open');
    }, 4200);
    setTimeout(() => {
        showScreen('calendar');
    }, 5400); 
}

window.addEventListener('beforeunload', (e) => {
    if (testActive) { e.preventDefault(); e.returnValue = 'Вы уверены?'; return e.returnValue; }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && testActive) registerViolation('Уход со страницы'); });
window.addEventListener('blur', () => { if (testActive) registerViolation('Потеря фокуса'); });
document.addEventListener('contextmenu', (e) => { if (testActive) e.preventDefault(); });
document.addEventListener('copy', (e) => { if (testActive) e.preventDefault(); });
document.addEventListener('keydown', (e) => {
    if (!testActive) return;
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) || (e.ctrlKey && e.key.toLowerCase() === 'u')) {
        e.preventDefault(); registerViolation('Инструменты разработчика');
    }
    if (e.ctrlKey && ['c','v','a','x'].includes(e.key.toLowerCase())) e.preventDefault();
});

function registerViolation(reason) {
    violations++;
    if (violations >= 2) blockTest(`Нарушений: ${violations}. Причина: ${reason}`);
    else { document.getElementById('overlay').classList.add('show'); setTimeout(() => document.getElementById('overlay').classList.remove('show'), 3000); showToast(`⚠️ Нарушение (${violations}/2)`); }
}

function blockTest(reason) {
    testActive = false;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('blockedReason').innerHTML = `<strong>Причина:</strong> ${reason}`;
    showScreen('blocked');
}

let toastTimer = null;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message; toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

(function initSnow() {
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, flakes = [];
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    function createFlake(randomY = false) { return { x: Math.random() * width, y: randomY ? Math.random() * height : -10, r: Math.random() * 2.5 + 1, speedY: Math.random() * 0.8 + 0.3, speedX: Math.random() * 0.6 - 0.3, opacity: Math.random() * 0.5 + 0.4, sway: Math.random() * Math.PI * 2, swaySpeed: Math.random() * 0.02 + 0.005 }; }
    function init() { resize(); flakes = []; for (let i = 0; i < Math.min(80, Math.floor(window.innerWidth / 15)); i++) flakes.push(createFlake(true)); }
    function draw() {
        ctx.clearRect(0, 0, width, height);
        for (const f of flakes) {
            f.sway += f.swaySpeed; f.x += Math.sin(f.sway) * 0.3 + f.speedX; f.y += f.speedY;
            if (f.y > height + 5) { f.y = -5; f.x = Math.random() * width; }
            if (f.x > width + 5) f.x = -5; if (f.x < -5) f.x = width + 5;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`; ctx.shadowBlur = 6; ctx.shadowColor = 'rgba(255, 255, 255, 0.8)'; ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize); 
    init(); 
    draw();
})();

    const logoContainer = document.getElementById('logoContainer');
